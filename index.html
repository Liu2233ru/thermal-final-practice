<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15345e">
  <meta name="description" content="按 2025–2026 热学 A 卷配额抽题的期末模拟考试。">
  <title>热学期末模拟</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="styles.css?v=4">
  <script src="vendor/katex/katex.min.js" defer></script>
  <script src="exam-math.js" defer></script>
  <script src="exam-assets.js" defer></script>
  <script src="exam-engine.js?v=4" defer></script>
  <script src="questions-a.js?v=4" defer></script>
  <script src="questions-b.js?v=4" defer></script>
  <script src="questions-c.js?v=4" defer></script>
  <script src="questions-d.js?v=4" defer></script>
  <script src="questions-p.js?v=4" defer></script>
  <script src="questions-t.js?v=4" defer></script>
  <script src="questions-u.js?v=4" defer></script>
  <script src="app.js?v=4" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">跳到主要内容</a>
  <header class="site-header">
    <div class="header-inner">
      <button class="wordmark" id="home-button" type="button" aria-label="热学期末模拟首页">
        <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>热学期末模拟</span>
      </button>
      <span class="header-state" id="header-state">模拟考试</span>
    </div>
    <nav class="workspace-nav" aria-label="学习分区">
      <div class="workspace-nav-inner">
        <button type="button" data-section="exam" aria-current="page">模拟考试</button>
        <button type="button" data-section="bank">题库全览</button>
        <button type="button" data-section="records">考试记录</button>
        <button type="button" data-section="library">错题复习</button>
      </div>
    </nav>
  </header>
  <main id="content" class="shell" tabindex="-1">
    <p id="storage-warning" class="notice warning" role="status" hidden></p>
    <div id="view"></div>
    <noscript><p class="notice warning">请在浏览器中启用 JavaScript 以使用模拟考试。</p></noscript>
  </main>
  <dialog class="dialog" id="confirm-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-detail">
    <form method="dialog">
      <h2 id="dialog-title"></h2>
      <p id="dialog-detail"></p>
      <div class="button-row dialog-actions">
        <button type="submit" class="button secondary" value="cancel" autofocus>取消</button>
        <button type="submit" class="button primary" value="confirm" id="dialog-confirm"></button>
      </div>
    </form>
  </dialog>
  <dialog class="dialog image-dialog" id="image-dialog" aria-labelledby="image-title">
    <div class="image-dialog-heading">
      <h2 id="image-title"></h2>
      <form method="dialog">
        <button type="submit" class="button secondary compact" autofocus>关闭大图</button>
      </form>
    </div>
    <div class="image-dialog-content" id="image-dialog-content"></div>
  </dialog>
  <input type="file" id="backup-input" accept=".json,application/json" hidden>
</body>
</html>
